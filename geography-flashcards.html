<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="description" content="World Explorer — a geography flashcard & quiz game for kids covering all 195 countries: flags, capitals, currencies, languages, continents, plus oceans, rivers and famous landmarks. Two age modes, sounds and a timed Whole World Challenge." />
<title>🌍 World Explorer — Geography Flashcards & Quiz (all 195 countries)</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='88'>🌍</text></svg>" />
<style>
  :root {
    --bg1:#2b6cff; --bg2:#7b3ff2; --bg3:#00c2a8;
    --ink:#12233b; --muted:#5a6b82;
    --card:#ffffff; --cardEdge:#e7edf6;
    --brand:#2b6cff; --brand2:#7b3ff2;
    --good:#18b26b; --goodBg:#e6f8ef;
    --bad:#e8483d;  --badBg:#fdeceb;
    --warn:#ff9f1c;
    --shadow:0 10px 30px rgba(20,40,80,.16);
    --radius:22px;
    --font: ui-rounded, "Segoe UI Rounded", "SF Pro Rounded", "Nunito",
            "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; }
  body {
    font-family:var(--font); color:var(--ink);
    background:linear-gradient(135deg,var(--bg1),var(--bg2) 55%,var(--bg3));
    background-attachment:fixed; min-height:100dvh; padding:16px;
    display:flex; align-items:flex-start; justify-content:center;
  }
  .app { width:100%; max-width:920px; margin:0 auto; }

  .topbar { display:flex; align-items:center; gap:10px; flex-wrap:wrap; color:#fff; margin-bottom:14px; }
  .logo { font-size:1.5rem; font-weight:900; letter-spacing:.3px; display:flex; align-items:center; gap:.5rem; text-shadow:0 2px 10px rgba(0,0,0,.2); }
  .logo .globe { font-size:1.7rem; animation:spin 18s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .spacer { flex:1; }
  .pill { background:rgba(255,255,255,.18); border:1px solid rgba(255,255,255,.35); color:#fff; padding:8px 14px; border-radius:999px; font-weight:800; font-size:.9rem; display:inline-flex; align-items:center; gap:.4rem; }
  .ghost-btn { background:rgba(255,255,255,.16); border:1px solid rgba(255,255,255,.4); color:#fff; padding:8px 14px; border-radius:999px; font-weight:800; cursor:pointer; font-size:.9rem; transition:transform .08s, background .15s; }
  .ghost-btn:hover { background:rgba(255,255,255,.3); }
  .ghost-btn:active { transform:scale(.96); }

  .panel { background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); padding:22px; border:1px solid var(--cardEdge); }
  h1,h2,h3 { margin:0 0 6px; line-height:1.15; }
  .lead { color:var(--muted); margin:0 0 18px; font-weight:600; }

  .age-grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  .age-card { border:3px solid var(--cardEdge); border-radius:20px; padding:22px; cursor:pointer; background:#fbfcff; text-align:center; transition:transform .1s, border-color .15s, box-shadow .15s; }
  .age-card:hover { transform:translateY(-3px); box-shadow:var(--shadow); border-color:var(--brand); }
  .age-card .emoji { font-size:3rem; }
  .age-card .who { font-weight:900; font-size:1.35rem; margin-top:6px; }
  .age-card .desc { color:var(--muted); font-size:.92rem; margin-top:6px; font-weight:600; }
  .age-card.six:hover { border-color:var(--good); }
  .scoreline { margin-top:10px; font-size:.82rem; font-weight:700; color:#33507a; background:#eef3ff; border-radius:12px; padding:8px 10px; line-height:1.4; }
  .scoreline.muted { color:var(--muted); background:#f4f6fb; font-weight:600; }
  .profile-actions { display:flex; gap:8px; justify-content:center; margin-top:10px; }
  .mini { appearance:none; border:1px solid var(--cardEdge); background:#fff; color:var(--muted); font-family:inherit; font-weight:800; font-size:.74rem; padding:6px 10px; border-radius:999px; cursor:pointer; }
  .mini:hover { border-color:var(--brand); color:var(--brand); }
  .shapesvg path { transition:fill .2s; }
  .points-pop { color:var(--good); font-weight:900; font-size:1.15rem; margin-top:6px; }

  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:14px; }
  .topic { position:relative; border:2px solid var(--cardEdge); border-radius:18px; padding:16px 12px; cursor:pointer; background:#fbfcff; text-align:center; transition:transform .1s, box-shadow .15s, border-color .15s; }
  .topic:hover { transform:translateY(-3px); box-shadow:var(--shadow); border-color:var(--brand); }
  .topic .ic { font-size:2.1rem; }
  .topic .nm { font-weight:800; margin-top:6px; font-size:.98rem; }
  .topic .ct { color:var(--muted); font-size:.78rem; font-weight:700; margin-top:2px; }
  .topic.section { grid-column:1/-1; background:none; border:none; padding:6px 2px 0; text-align:left; cursor:default; box-shadow:none; transform:none; }
  .topic.section .label { font-weight:900; color:#33507a; font-size:.9rem; letter-spacing:.4px; text-transform:uppercase; opacity:.8; }
  .topic.challenge { grid-column:1/-1; background:linear-gradient(135deg,#fff2d6,#ffe0e9,#e7ecff); border:2px solid #ffd98a; display:flex; align-items:center; gap:16px; text-align:left; padding:18px; }
  .topic.challenge .ic { font-size:2.6rem; }
  .topic.challenge .nm { font-size:1.15rem; }
  .topic.challenge .ct { font-size:.85rem; }
  .rec { position:absolute; top:-9px; right:8px; background:var(--good); color:#fff; font-size:.64rem; font-weight:900; padding:3px 8px; border-radius:999px; letter-spacing:.3px; }

  .btn { appearance:none; border:none; cursor:pointer; font-family:inherit; background:linear-gradient(135deg,var(--brand),var(--brand2)); color:#fff; font-weight:900; font-size:1.05rem; padding:14px 22px; border-radius:16px; box-shadow:0 8px 20px rgba(43,108,255,.35); transition:transform .08s, filter .15s; }
  .btn:hover { filter:brightness(1.05); }
  .btn:active { transform:scale(.97); }
  .btn.big { width:100%; font-size:1.15rem; padding:16px; }
  .btn.green { background:linear-gradient(135deg,#18b26b,#0ea36a); box-shadow:0 8px 20px rgba(24,178,107,.35); }
  .btn.soft { background:#eef3ff; color:var(--brand); box-shadow:none; }
  .btn.soft:hover { background:#e2ebff; }
  .row { display:flex; gap:12px; flex-wrap:wrap; align-items:center; }
  .row.between { justify-content:space-between; }

  .learn-head { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:14px; }
  .setbadge { background:#eef3ff; color:var(--brand); font-weight:900; padding:8px 14px; border-radius:999px; white-space:nowrap; }
  .cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:14px; }
  .flip { perspective:1000px; height:190px; cursor:pointer; }
  .flip-inner { position:relative; width:100%; height:100%; transition:transform .5s; transform-style:preserve-3d; }
  .flip.flipped .flip-inner { transform:rotateY(180deg); }
  .face { position:absolute; inset:0; backface-visibility:hidden; border-radius:18px; border:2px solid var(--cardEdge); background:#fff; padding:12px; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; box-shadow:0 6px 16px rgba(20,40,80,.08); }
  .face .visual { width:100%; height:74px; display:flex; align-items:center; justify-content:center; margin-bottom:6px; }
  .face .visual svg, .face .visual img { max-height:74px; max-width:100%; border-radius:6px; }
  .flagpic { display:block; height:auto; box-shadow:0 1px 5px rgba(20,40,80,.2); background:#fff; }
  .face .q { font-weight:800; font-size:.96rem; }
  .face .tapme { color:var(--muted); font-size:.72rem; font-weight:700; margin-top:8px; }
  .back { transform:rotateY(180deg); background:linear-gradient(135deg,#eafff4,#e9f2ff); border-color:#cdeedd; }
  .back .a { font-weight:900; font-size:1.05rem; color:var(--good); }
  .back .fact { color:var(--muted); font-size:.76rem; font-weight:600; margin-top:8px; line-height:1.3; }

  .progress { height:12px; background:#eef2f8; border-radius:999px; overflow:hidden; margin:4px 0 6px; }
  .progress > i { display:block; height:100%; background:linear-gradient(90deg,var(--brand),var(--brand2)); border-radius:999px; transition:width .3s; }
  .timerbar { height:14px; background:#eef2f8; border-radius:999px; overflow:hidden; }
  .timerbar > i { display:block; height:100%; background:linear-gradient(90deg,#18b26b,#7ee0a6); transition:width .25s linear; }
  .timerbar.warn > i { background:linear-gradient(90deg,#ff9f1c,#ffd27a); }
  .timerbar.danger > i { background:linear-gradient(90deg,#e8483d,#ff9a90); }
  .qcard { text-align:center; }
  .qvisual { min-height:120px; display:flex; align-items:center; justify-content:center; margin:6px 0 4px; }
  .qvisual svg { max-height:150px; max-width:100%; border-radius:10px; box-shadow:0 6px 16px rgba(20,40,80,.12); }
  .qvisual img.flagpic { max-height:130px; width:auto; border-radius:8px; }
  .qtext { font-size:1.3rem; font-weight:900; margin:8px 0 16px; }
  .answers { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .ans { appearance:none; font-family:inherit; cursor:pointer; text-align:left; border:2px solid var(--cardEdge); background:#fbfcff; color:var(--ink); padding:16px; border-radius:16px; font-weight:800; font-size:1.02rem; display:flex; align-items:center; gap:10px; transition:transform .08s, border-color .12s, background .12s; }
  .ans .key { width:30px; height:30px; flex:none; border-radius:50%; background:#eef3ff; color:var(--brand); display:flex; align-items:center; justify-content:center; font-weight:900; }
  .ans:hover:not(:disabled) { border-color:var(--brand); transform:translateY(-2px); }
  .ans:disabled { cursor:default; }
  .ans.correct { border-color:var(--good); background:var(--goodBg); }
  .ans.correct .key { background:var(--good); color:#fff; }
  .ans.wrong { border-color:var(--bad); background:var(--badBg); }
  .ans.wrong .key { background:var(--bad); color:#fff; }
  .feedback { margin-top:14px; font-weight:900; font-size:1.05rem; min-height:1.4em; }
  .feedback.good { color:var(--good); }
  .feedback.bad { color:var(--bad); }

  .result { text-align:center; }
  .stars { font-size:2.4rem; letter-spacing:6px; margin:6px 0; }
  .score-num { font-size:3rem; font-weight:900; }
  .review { text-align:left; margin-top:16px; display:grid; gap:8px; }
  .review .item { display:flex; gap:10px; align-items:flex-start; padding:10px 12px; border-radius:12px; background:#fbfcff; border:1px solid var(--cardEdge); font-weight:600; }
  .review .item .tick { font-size:1.1rem; }
  .review .item small { color:var(--muted); display:block; font-weight:700; }
  .badge-big { font-size:3.4rem; margin:4px 0; }

  .chip-row { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:6px; flex-wrap:wrap; }
  .lives { font-size:1.2rem; letter-spacing:2px; }
  .streak { background:#fff4e0; color:#b5651d; font-weight:900; padding:6px 12px; border-radius:999px; font-size:.9rem; }
  .streak.hot { background:#ffe1e1; color:#d63a2f; animation:pulse .5s ease; }
  @keyframes pulse { 0%{transform:scale(1)} 50%{transform:scale(1.15)} 100%{transform:scale(1)} }

  .center { text-align:center; }
  .muted { color:var(--muted); font-weight:600; }
  footer { color:rgba(255,255,255,.9); text-align:center; font-size:.8rem; margin-top:16px; font-weight:600; }

  .confetti { position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:50; }
  .confetti i { position:absolute; top:-10vh; width:10px; height:14px; opacity:.9; border-radius:2px; animation:fall linear forwards; }
  @keyframes fall { to { transform:translateY(115vh) rotate(720deg); } }

  @media (max-width:560px){
    .age-grid { grid-template-columns:1fr; }
    .answers { grid-template-columns:1fr; }
    .qtext { font-size:1.15rem; }
    .panel { padding:16px; }
  }
</style>
</head>

<div class="app" id="app"></div>
<div class="confetti" id="confetti" aria-hidden="true"></div>

/* ==================================================================
   2. LANDMARK ART — richer hand-drawn illustrations (inline SVG, offline).
      Each scene() call uses a unique id prefix so gradients/clips never
      collide when several landmarks are shown at once in the learn grid.
   ================================================================== */
function scene(id, inner, o={}){
  const { s1="#e6f4ff", s2="#9fd2ff", ground="#7ec86a", gy=98, sun=1, sunX=97, sunY=22, clouds=1 } = o;
  return `<svg viewBox="0 0 120 120" width="150" height="150" role="img" preserveAspectRatio="xMidYMid meet">
    <defs>
      <clipPath id="c${id}"><rect width="120" height="120" rx="14"/></clipPath>
      <linearGradient id="s${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${s1}"/><stop offset="1" stop-color="${s2}"/></linearGradient>
      <radialGradient id="g${id}" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#fff6c8"/><stop offset="55%" stop-color="#ffd642"/><stop offset="100%" stop-color="#ffd642" stop-opacity="0"/></radialGradient>
    </defs>
    <g clip-path="url(#c${id})">
      <rect width="120" height="120" fill="url(#s${id})"/>
      ${sun?`<circle cx="${sunX}" cy="${sunY}" r="17" fill="url(#g${id})"/><circle cx="${sunX}" cy="${sunY}" r="8.5" fill="#ffe066"/>`:""}
      ${clouds?`<g fill="#fff" opacity=".9"><ellipse cx="24" cy="28" rx="13" ry="6.5"/><ellipse cx="33" cy="25" rx="9" ry="6"/><ellipse cx="15" cy="25" rx="7" ry="5"/></g>`:""}
      <rect x="0" y="${gy}" width="120" height="${120-gy}" fill="${ground}"/>
      ${inner}
    </g>
  </svg>`;
}

/* ---------- Sound (Web Audio — no files, offline) ----------
   Robust unlocking: browsers (especially iOS/Safari) only allow audio to
   start inside a user gesture, so we resume the context and play a silent
   buffer on the first touch/click anywhere, and again on every action. */
const Sound = (()=>{
  let ctx=null, muted=false, primed=false;
  try { muted = localStorage.getItem("we_muted")==="1"; } catch(e){}
  function ac(){ if(!ctx){ const AC=window.AudioContext||window.webkitAudioContext; if(AC){ try{ ctx=new AC(); }catch(e){} } } if(ctx&&ctx.state==="suspended"){ try{ ctx.resume(); }catch(e){} } return ctx; }
  function note(freq,t0,dur,type="sine",vol=0.2){ const c=ac(); if(!c) return; const o=c.createOscillator(),g=c.createGain(); o.type=type; o.frequency.value=freq; const t=c.currentTime+t0; g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+0.012); g.gain.exponentialRampToValueAtTime(0.0001,t+dur); o.connect(g).connect(c.destination); o.start(t); o.stop(t+dur+0.03); }
  const api={
    get muted(){ return muted; },
    toggle(){ muted=!muted; try{ localStorage.setItem("we_muted",muted?"1":"0"); }catch(e){} api.unlock(); if(!muted) api.click(); return muted; },
    unlock(){ const c=ac(); if(c && !primed){ try{ const b=c.createBuffer(1,1,22050); const s=c.createBufferSource(); s.buffer=b; s.connect(c.destination); s.start(0); primed=true; }catch(e){} } },
    click(){ if(muted)return; note(300,0,0.06,"triangle",0.12); },
    flip(){ if(muted)return; note(520,0,0.07,"sine",0.14); note(690,0.05,0.07,"sine",0.12); },
    correct(){ if(muted)return; [523,659,784,1047].forEach((f,i)=>note(f,i*0.08,0.16,"sine",0.2)); },
    wrong(){ if(muted)return; note(200,0,0.22,"sawtooth",0.16); note(150,0.12,0.22,"sawtooth",0.14); },
    tick(){ if(muted)return; note(880,0,0.03,"square",0.06); },
    life(){ if(muted)return; note(330,0,0.18,"square",0.16); note(220,0.12,0.22,"square",0.14); },
    streak(n){ if(muted)return; const base=520+Math.min(n,6)*60; note(base,0,0.10,"triangle",0.16); note(base*1.5,0.06,0.10,"triangle",0.14); },
    fanfare(){ if(muted)return; [523,659,784,1047,1319].forEach((f,i)=>note(f,i*0.12,0.30,"triangle",0.18)); note(784,0.6,0.5,"sine",0.16); },
    sad(){ if(muted)return; [392,349,330,294].forEach((f,i)=>note(f,i*0.16,0.28,"sine",0.16)); },
  };
  return api;
})();
// Resume/prime audio on the very first interaction anywhere (autoplay policies).
["pointerdown","touchend","mousedown","keydown"].forEach(ev=>
  window.addEventListener(ev, ()=>Sound.unlock(), { passive:true }));

const Profiles = {
  key:"we_profiles_v1",
  blank(){ return { name:"", points:0, correct:0, questions:0, quizzes:0, bestStreak:0, medals:0 }; },
  all(){ try{ return JSON.parse(localStorage.getItem(this.key))||{}; }catch(e){ return {}; } },
  get(age){ return Object.assign(this.blank(), this.all()[age]||{}); },
  set(age,p){ const a=this.all(); a[age]=p; try{ localStorage.setItem(this.key, JSON.stringify(a)); }catch(e){} },
  update(age,fn){ const p=this.get(age); fn(p); this.set(age,p); return p; },
  reset(age){ const a=this.all(); const keepName=(a[age]||{}).name||""; a[age]=Object.assign(this.blank(),{name:keepName}); try{ localStorage.setItem(this.key,JSON.stringify(a)); }catch(e){} },
  displayName(age){ const n=this.get(age).name; return n || (age==="6"?"Explorer (age 6 & under)":"Explorer (age 10)"); },
};

function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function pick(a){ return a[Math.floor(Math.random()*a.length)]; }

    case "capitals":   q=`What is the capital of ${o.n}?`; a=o.cap; break;
    case "currencies": q=`What money is used in ${o.n}?`; a=o.cur; break;
    case "languages":  q=`Name a main language of ${o.n}.`; a=o.lang; break;
    case "wherecont":  q=`Which continent is ${o.n} in?`; a=o.ct; break;
  }
  return { q, a, v: topic.shape?{type:"shape",code:o.c}:{type:"flag",code:o.c}, f:`${o.n} — capital ${o.cap}, in ${o.ct}. Money: ${o.cur}. Language: ${o.lang}.`, _topic:topic };
}
function countryCards(topic, pool){ return pool.map(o=>countryCard(topic,o)); }

// cards for the current topic + region (age-filtered for curated)
function currentCards(){
  const t=state.topic;
  if(t.kind==="country") return countryCards(t, activePool(t, state.region));
  const raw = state.age==="6" ? t.cards.filter(c=>c.y) : t.cards;
  return raw.map(c=>({...c, _topic:t}));
}

function buildOptions(card, countryPool){
  const t=card._topic;
  if(t.kind==="country"){
    if(t.id==="wherecont") return shuffle([card.a, ...shuffle(CONTINENTS.filter(x=>x!==card.a)).slice(0,3)]);
    const src = (countryPool && countryPool.length>=5) ? countryPool : COUNTRIES;
    let vals=[...new Set(src.map(o=>o[t.field]).filter(Boolean))].filter(v=>v!==card.a);
    if(vals.length<3) vals=[...new Set(COUNTRIES.map(o=>o[t.field]).filter(Boolean))].filter(v=>v!==card.a);
    return shuffle([card.a, ...shuffle(vals).slice(0,3)]);
  }
  if(card.opts) return shuffle(card.opts.slice());
  const vals=[...new Set(t.cards.map(c=>c.a))].filter(v=>v!==card.a);
  return shuffle([card.a, ...shuffle(vals).slice(0,3)]);
}

/* ---------- Quiz ---------- */

  Sound.unlock();

  let cards, pool=null;
  if(state.topic.kind==="country"){ pool=activePool(state.topic, state.region); cards=shuffle(countryCards(state.topic,pool)); }
  else cards=shuffle(currentCards());
  state.quiz = cards.slice(0, Math.min(10, cards.length)).map(c=>({ card:c, options:buildOptions(c, pool) }));
  state.qIndex=0; state.score=0; state.log=[]; state.answered=false; state.award=null;
  state.streak=0; state.bestStreak=0; state.lives=3;
  state.timePerQ = state.age==="6" ? 25 : 15;
  state.view="quiz"; render();
}

/* ---------- Whole World Challenge ---------- */
function startChallenge(){
  Sound.unlock();
  state.mode="challenge";
  state.topic={id:"challenge", kind:"challenge", nm:"Whole World Challenge", ic:"🏆"};
  const cset = state.age==="6" ? COUNTRIES.filter(o=>FAMOUS.has(o.c)) : COUNTRIES;
  const flagsT=TOPIC_BY_ID.flags, capsT=TOPIC_BY_ID.capitals, contT=TOPIC_BY_ID.wherecont, shapeT=TOPIC_BY_ID.shapes;
  let pool=[];
  cset.forEach(o=>{ pool.push(countryCard(flagsT,o)); pool.push(countryCard(capsT,o)); pool.push(countryCard(contT,o)); if(state.age!=="6" && hasShape(o.c)) pool.push(countryCard(shapeT,o)); });
  CURATED_TOPICS.forEach(t=> (state.age==="6"?t.cards.filter(c=>c.y):t.cards).forEach(c=> pool.push({...c,_topic:t})));
  const count = state.age==="6" ? 12 : 20;
  state.quiz = shuffle(pool).slice(0,count).map(c=>({ card:c, options:buildOptions(c, cset) }));
  state.qIndex=0; state.score=0; state.log=[]; state.answered=false; state.award=null;
  state.lives=3; state.streak=0; state.bestStreak=0;
  state.timePerQ = state.age==="6" ? 22 : 14;
  state.view="quiz"; render();
}

function renderQuiz(){
  const item=state.quiz[state.qIndex]; const c=item.card;
  const total=state.quiz.length; const pct=Math.round((state.qIndex)/total*100);
  const challenge=state.mode==="challenge";
  const hearts=challenge?`<span class="lives">${"❤️".repeat(state.lives)}${"🤍".repeat(3-state.lives)}</span>`:"";
  const streakChip=challenge?`<span class="streak${state.streak>=3?" hot":""}">🔥 Streak: ${state.streak}</span>`:"";

  app.innerHTML = header() + `
  <div class="panel qcard">
    ${challenge?`<div class="chip-row">${hearts}${streakChip}</div>`:""}
    <div class="row between" style="margin-bottom:2px">
      <span class="muted">${challenge?"🏆 ":""}Question ${state.qIndex+1} of ${total}</span>
      <span class="muted">Score: <b style="color:var(--brand)">${state.score}</b></span>
    </div>
    <div class="progress"><i style="width:${pct}%"></i></div>
    <div class="timerbar" id="tbar"><i id="tfill" style="width:100%"></i></div>

    <div class="answers">
      ${item.options.map((o,i)=>`<button class="ans" data-opt="${encodeURIComponent(o)}"><span class="key">${["A","B","C","D"][i]}</span><span>${o}</span></button>`).join("")}
    </div>
    <div class="feedback" id="fb"></div>
    <div class="center" style="margin-top:12px"><button class="btn" id="nextQ" style="display:none">Next →</button></div>
  </div>` + footer();

  app.querySelectorAll(".ans").forEach(b=> b.onclick=()=> pickAnswer(decodeURIComponent(b.dataset.opt)));
  startTimer(); wireHome();
}

function startTimer(){
  clearInterval(state.timer);
  state.timeLeft=state.timePerQ;
  const fill=document.getElementById("tfill"), bar=document.getElementById("tbar");
  let lastSec=Math.ceil(state.timeLeft);
  const tick=()=>{
    const p=Math.max(0,state.timeLeft/state.timePerQ*100);
    if(fill) fill.style.width=p+"%";
    if(bar){ bar.classList.toggle("warn", p<=50&&p>25); bar.classList.toggle("danger", p<=25); }
    const sec=Math.ceil(state.timeLeft);
    if(sec!==lastSec){ lastSec=sec; if(!state.answered && state.timeLeft<=5 && state.timeLeft>0.15) Sound.tick(); }
    if(state.timeLeft<=0){ clearInterval(state.timer); if(!state.answered) pickAnswer(null); return; }
    state.timeLeft-=0.1;
  };
  tick(); state.timer=setInterval(tick,100);
}

function pickAnswer(choice){
  if(state.answered) return;
  state.answered=true; clearInterval(state.timer);
  const item=state.quiz[state.qIndex]; const correct=item.card.a; const isRight=choice===correct;
  const challenge=state.mode==="challenge";
  if(isRight){ state.score++; state.streak++; if(state.streak>state.bestStreak) state.bestStreak=state.streak; }
  else { state.streak=0; if(challenge) state.lives--; }
  state.log.push({ q:item.card.q, a:correct, chosen:choice, right:isRight });

  app.querySelectorAll(".ans").forEach(b=>{ b.disabled=true; const val=decodeURIComponent(b.dataset.opt); if(val===correct) b.classList.add("correct"); else if(val===choice) b.classList.add("wrong"); });

  if(isRight){ (challenge && state.streak>=3) ? Sound.streak(state.streak) : Sound.correct(); }
  else { Sound.wrong(); if(challenge) setTimeout(()=>Sound.life(),260); }

  const outOfLives = challenge && state.lives<=0;
  const lastQ = state.qIndex>=state.quiz.length-1;
  const ending = outOfLives || lastQ;

  const fb=document.getElementById("fb");
  if(fb){
    if(isRight){ let t=pick(["🎉 Correct!","⭐ Brilliant!","✅ Yes! Well done!","👏 Spot on!"]); if(challenge&&state.streak>=3) t=`🔥 ${state.streak} in a row! `+t; fb.className="feedback good"; fb.textContent=t; }
    else if(choice===null){ fb.className="feedback bad"; fb.textContent=`⏰ Time's up! The answer is ${correct}.`+(challenge?" 💔 Lost a life.":""); }
    else { fb.className="feedback bad"; fb.textContent=`❌ Not quite — it's ${correct}.`+(challenge?" 💔 Lost a life.":""); }
    if(outOfLives) fb.textContent+=" No lives left!";
  }
  const nb=document.getElementById("nextQ");
  if(nb){ nb.style.display="inline-block"; nb.textContent = ending?(challenge?"See my result 🏆":"See my score 🏆"):"Next →";
    nb.onclick=()=>{ if(!ending){ state.qIndex++; state.answered=false; render(); } else { finishQuiz(); } }; }
}

/* ---------- Finish: award cumulative points to the child's profile (once) ---------- */
function finishQuiz(){
  const challenge=state.mode==="challenge";
  const answered=state.log.length, s=state.score;
  const survived=challenge && state.lives>0;
  const pct=answered? s/answered : 0;
  const base=s*10;
  const streakBonus = state.bestStreak>=3 ? state.bestStreak*5 : 0;
  const challengeBonus = challenge && survived ? 50 : 0;
  const perfect = answered>0 && s===answered ? 20 : 0;
  const gained = base+streakBonus+challengeBonus+perfect;
  const medal = ((challenge&&survived)||!challenge) && pct>=0.9 ? 1 : 0;
  const prof = Profiles.update(state.age, p=>{ p.points+=gained; p.correct+=s; p.questions+=answered; p.quizzes+=1; if(state.bestStreak>p.bestStreak) p.bestStreak=state.bestStreak; p.medals+=medal; });
  state.award={ gained, base, streakBonus, challengeBonus, perfect, medal, total:prof.points };
  state.view="results"; render();
}

    <p class="lead" style="margin-top:8px">${msg}</p>
    <div class="row" style="justify-content:center">
      <button class="btn green" id="again">${challenge?"Try again 🔁":"Play again 🔁"}</button>
      ${challenge?"":`<button class="btn soft" id="learnMore">Back to cards 📚</button>`}
      <button class="btn soft" id="newTopic">${challenge?"Back to topics 🧭":"New topic 🧭"}</button>
    </div>
    <div class="review">${review}</div>
  </div>` + footer();

  const celebrate = challenge ? (survived&&pctScore>=0.75) : (pctScore>=0.75);
  if(celebrate){ burstConfetti(); Sound.fanfare(); } else Sound.sad();
  app.querySelector("#again").onclick = challenge ? startChallenge : startQuiz;
  const lm2=app.querySelector("#learnMore"); if(lm2) lm2.onclick=()=>{ Sound.click(); state.learnPage=0; state.view="learn"; render(); };
  app.querySelector("#newTopic").onclick=()=>{ Sound.click(); state.view="topics"; render(); };
  wireHome();
}

function burstConfetti(){
  const c=document.getElementById("confetti");
  const colors=["#2b6cff","#7b3ff2","#18b26b","#ff9f1c","#e8483d","#00c2a8"];
  for(let i=0;i<80;i++){ const s=document.createElement("i"); s.style.left=(Math.random()*100)+"vw"; s.style.background=colors[i%colors.length]; s.style.animationDuration=(2+Math.random()*2)+"s"; s.style.animationDelay=(Math.random()*0.6)+"s"; s.style.transform=`scale(${0.6+Math.random()})`; c.appendChild(s); setTimeout(()=>s.remove(),4200); }
}

function render(){
  clearInterval(state.timer); window.scrollTo(0,0);
  switch(state.view){
    case "age": renderAge(); break;
    case "topics": renderTopics(); break;
    case "region": renderRegion(); break;
    case "learn": renderLearn(); break;
    case "quiz": renderQuiz(); break;
    case "results": renderResults(); break;
    default: renderAge();
  }
  wireMute(); wireBack();
}
render();
</script>
</body>
</html>
